<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>보면대</title>
<meta name="description" content="이미지·PDF 악보를 정리하고 필기·자동 넘김·메트로놈·튜너·녹음으로 연주하는 악보 뷰어">
<meta name="theme-color" content="#1c2230">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="보면대">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script>window.PDF_WORKER='lib/pdf.worker.min.js'</script>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="lib/pdf.min.js"></script>
<style>
/* Layout: score fills the screen like a page on a music stand; frosted pills float over it (tabs top, tools bottom); the library slides in from the left as a shelf of book covers. */
:root{
  --stage:#d6d9de; --glass:rgba(255,255,255,.80); --glass-2:rgba(255,255,255,.96); --ink:#1d2129; --muted:#666e7b; --line:rgba(30,36,46,.12);
  --accent:#9a651a; --accent-soft:rgba(154,101,26,.13); --accent-ink:#fff; --rec:#cf3a30; --ok:#2f8150; --raise:#ffffff;
  --shadow:0 2px 6px rgba(20,24,32,.08),0 12px 32px rgba(20,24,32,.14);
  --f-display:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#0c0e11; --glass:rgba(34,38,45,.80); --glass-2:rgba(40,45,53,.97); --ink:#ebe8e2; --muted:#9ca3ae; --line:rgba(255,255,255,.10);
  --accent:#dcaa52; --accent-soft:rgba(220,170,82,.16); --accent-ink:#1a1306; --rec:#ea5a50; --ok:#61c389; --raise:#262b33;
  --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#0c0e11; --glass:rgba(34,38,45,.80); --glass-2:rgba(40,45,53,.97); --ink:#ebe8e2; --muted:#9ca3ae; --line:rgba(255,255,255,.10);
  --accent:#dcaa52; --accent-soft:rgba(220,170,82,.16); --accent-ink:#1a1306; --rec:#ea5a50; --ok:#61c389; --raise:#262b33;
  --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:var(--shadow);border:1px solid var(--line)}

/* stage */
#stage{position:fixed;inset:0;overflow:auto;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none}
.spread{transform-origin:50% 50%;min-height:100%;min-width:100%;width:max-content;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:calc(8px + var(--st)) calc(8px + var(--sr)) calc(8px + var(--sb)) calc(8px + var(--sl))}
#stage.scroll .spread{flex-direction:column;justify-content:flex-start;gap:14px;width:100%;padding-top:calc(70px + var(--st));padding-bottom:calc(150px + var(--sb))}
.sheet{position:relative;background:#fff;box-shadow:0 2px 16px rgba(0,0,0,.22);flex:none}
.spread.two .sheet:first-child{box-shadow:0 2px 16px rgba(0,0,0,.22),inset -14px 0 18px -14px rgba(0,0,0,.28)}
.spread.two .sheet:last-child{box-shadow:0 2px 16px rgba(0,0,0,.22),inset 14px 0 18px -14px rgba(0,0,0,.28)}
.sheet canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sheet .ann{pointer-events:none}
#stage.drawing .sheet .ann{pointer-events:auto;touch-action:none;cursor:crosshair}
.pno{position:absolute;bottom:6px;right:8px;font-family:var(--f-mono);font-size:11px;color:#777;background:rgba(255,255,255,.85);padding:0 5px;border-radius:4px;display:none}
#stage.scroll .pno{display:block}
.blank{display:grid;place-items:center;text-align:center;gap:14px;color:var(--muted);max-width:340px;margin:auto}
.blank b{display:block;font-family:var(--f-display);font-size:24px;color:var(--ink)}
.turn-flash{position:fixed;top:0;bottom:0;width:16%;pointer-events:none;opacity:0;transition:opacity .3s;z-index:2}
.turn-flash.l{left:0;background:linear-gradient(90deg,var(--accent-soft),transparent)}
.turn-flash.r{right:0;background:linear-gradient(270deg,var(--accent-soft),transparent)}
.turn-flash.show{opacity:1;transition:none}
#atBar{position:fixed;left:0;top:0;height:3px;width:0;background:var(--accent);z-index:30}

/* chrome */
.chrome{transition:opacity .2s,transform .2s}
body.noui .chrome,body.perf .chrome{opacity:0;pointer-events:none}
body.noui .chrome.top,body.perf .chrome.top{transform:translateY(-12px)}
body.noui .chrome.bottom,body.perf .chrome.bottom{transform:translateY(12px)}
.top{position:fixed;z-index:10;top:calc(10px + var(--st));left:calc(12px + var(--sl));right:calc(12px + var(--sr));display:flex;align-items:center;gap:10px;pointer-events:none}
.top>*{pointer-events:auto}
.pill-btn{display:inline-flex;align-items:center;gap:4px;height:44px;padding:0 16px 0 12px;border-radius:22px;font-weight:500;flex:none}
.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.round.on{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.tabs{flex:1;min-width:0;height:44px;border-radius:22px;display:flex;align-items:center;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none;box-sizing:border-box}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 1 0;min-width:120px;max-width:300px;height:36px;border-radius:18px;border:0;background:transparent;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:13px;color:var(--muted)}
.tab .sw{width:9px;height:20px;border-radius:2px;flex:none}
.tab .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.tab+.tab:not(.on){box-shadow:-1px 0 0 var(--line)}
.tab.on{background:var(--glass-2);color:var(--ink);font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.12);flex:1.6 1 0}
.tab .x,.tab .inf{display:none;width:24px;height:24px;border-radius:50%;place-items:center;color:var(--muted);flex:none}
.tab.on .x,.tab.on .inf{display:grid}
.tab .x:hover,.tab .inf:hover{background:var(--accent-soft);color:var(--ink)}
.tab .x svg.i,.tab .inf svg.i{width:17px;height:17px}
.tab-empty{padding:0 14px;color:var(--muted);font-size:13px;white-space:nowrap}
.bottom{position:fixed;z-index:10;left:calc(12px + var(--sl));right:calc(12px + var(--sr));bottom:calc(12px + var(--sb));display:flex;flex-direction:column;gap:12px;pointer-events:none}
.bottom>*{pointer-events:auto}
.scrub{position:relative;height:30px;display:flex;align-items:center;gap:10px;margin:0 6px}
.scrub .track{position:relative;flex:1;height:30px}
.scrub .rail{position:absolute;left:0;right:0;top:13px;height:4px;border-radius:2px;background:rgba(120,128,140,.35)}
.scrub .fill{position:absolute;left:0;top:13px;height:4px;border-radius:2px;background:var(--accent);opacity:.7}
.scrub .dot{position:absolute;top:11px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink);opacity:.65;pointer-events:none}
.scrub input{position:absolute;inset:0;width:100%;margin:0;opacity:0;cursor:pointer}
.scrub .knob{position:absolute;top:2px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--glass-2);box-shadow:0 1px 5px rgba(0,0,0,.3);border:1px solid var(--line);pointer-events:none}
.scrub .lbl{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;padding:2px 10px;border-radius:12px;white-space:nowrap;max-width:50%;overflow:hidden;text-overflow:ellipsis}
.pills{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px}
.pills>.l{justify-self:start}.pills>.r{justify-self:end}
.pill{display:flex;align-items:center;border-radius:30px;padding:4px;gap:2px;height:60px;box-sizing:border-box}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:74px;height:52px;border:0;border-radius:26px;background:transparent;font-size:11px;color:var(--ink);padding:0 8px}
.tool:hover{background:rgba(127,127,127,.12)}
.tool.on{background:var(--accent-soft);color:var(--accent)}
.tool.live{color:var(--rec)}
.pill .fold{width:36px;height:52px;border:0;background:transparent;border-radius:26px;display:grid;place-items:center;color:var(--muted)}

/* popovers */
#pop{position:fixed;z-index:12;width:360px;max-width:calc(100% - 24px);max-height:min(66vh,620px);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box}
#pop.at-l{left:calc(12px + var(--sl));bottom:calc(126px + var(--sb))}
#pop.at-c{left:50%;transform:translateX(-50%);bottom:calc(126px + var(--sb))}
#pop.at-tr{right:calc(12px + var(--sr));top:calc(64px + var(--st))}
#pop.wide{left:calc(12px + var(--sl));right:calc(12px + var(--sr));width:auto;max-width:none;transform:none;max-height:none}
#pop header{display:flex;align-items:center;gap:8px;padding:14px 10px 6px 18px}
#pop header h3{flex:1;margin:0;font-family:var(--f-display);font-size:18px}
.pbody{overflow:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row>*{min-width:0}
.seg{display:flex;background:rgba(127,127,127,.14);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;height:30px;border-radius:8px;font-size:13px;white-space:nowrap;padding:0 8px}
.seg button.on{background:var(--raise);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:700;color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;flex:1}
.field span{font-size:12px;color:var(--muted)}
.tx{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--raise);padding:0 11px;width:100%;box-sizing:border-box}
textarea.tx{height:70px;padding:8px 11px;resize:vertical}
.num{width:78px;font-family:var(--f-mono)}
input[type=range]{accent-color:var(--accent)}
.rng{display:flex;align-items:center;gap:10px}
.rng input{flex:1;min-width:0}
.rng output{font-family:var(--f-mono);font-size:12px;min-width:46px;text-align:right}
.rng .k{font-size:12px;min-width:40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--raise);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--rec)}
.btn.sm{height:32px;padding:0 10px;font-size:13px;border-radius:10px}
.btn.wide{flex:1}
.btn svg.i{width:18px;height:18px}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:inherit;flex:none}
.ib:hover{background:rgba(127,127,127,.15)}
.ib svg.i{width:19px;height:19px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--line);background:var(--raise);font-size:12px}
.chip:hover,.chip.on{border-color:var(--accent);color:var(--accent)}
.lst{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;padding:7px 6px 7px 12px;border-radius:12px;background:var(--raise);border:1px solid var(--line)}
.li.cur{border-color:var(--accent)}
.li .g{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0}
.li .g b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .g span{font-size:12px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:0}
.notice{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--raise)}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.check input{accent-color:var(--accent);width:17px;height:17px;flex:none}
.big{font-family:var(--f-mono);font-size:46px;font-weight:500;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.beats{display:flex;justify-content:center;gap:10px;padding:4px 0}
.beats i{width:15px;height:15px;border-radius:50%;background:rgba(127,127,127,.25)}
.beats i.acc{outline:2px solid var(--accent-soft);outline-offset:2px}
.beats i.hit{background:var(--accent)}
.rec-btn{width:72px;height:72px;border-radius:50%;border:4px solid rgba(207,58,48,.3);background:var(--raise);display:grid;place-items:center;margin:0 auto}
.rec-btn i{width:30px;height:30px;border-radius:50%;background:var(--rec);transition:all .15s}
.rec-btn.on i{border-radius:6px;width:26px;height:26px}
.meter{height:6px;border-radius:3px;background:rgba(127,127,127,.2);overflow:hidden;width:100%}
.meter i{display:block;height:100%;width:0;background:var(--ok)}
audio{width:100%;height:36px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.pcell{display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.pcell button.th{padding:0;border:2px solid transparent;border-radius:4px;background:#fff;width:100%;aspect-ratio:3/4;max-width:100%;display:grid;place-items:center;overflow:hidden}
.pcell.cur button.th{border-color:var(--accent)}
.pcell canvas{max-width:100%;max-height:100%}
.pcell .acts{display:flex}
.pcell .acts .ib{width:24px;height:26px}
.pcell .acts .ib svg.i{width:15px;height:15px}
.pcell small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tuner-dial{position:relative;height:110px;overflow:hidden}
.tuner-dial .scale{position:absolute;left:8%;right:8%;bottom:14px;height:2px;background:rgba(127,127,127,.3)}
.tuner-dial .tick{position:absolute;bottom:14px;width:2px;height:10px;background:rgba(127,127,127,.5);margin-left:-1px}
.tuner-dial .tick.z{height:22px;background:var(--ok)}
.tuner-dial .needle{position:absolute;left:50%;bottom:14px;width:3px;height:80px;margin-left:-1.5px;background:var(--rec);border-radius:2px;transform-origin:50% 100%;transition:transform .12s}
.tuner-dial .needle.ok{background:var(--ok)}
.tuner-note{text-align:center;line-height:1}
.tuner-note b{font-family:var(--f-display);font-size:44px}
.tuner-note span{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:6px}
.strings{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.strings button{min-width:46px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--raise);font-family:var(--f-mono);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.strings button small{font-size:10px;color:var(--muted)}
.strings button.hit{border-color:var(--ok);color:var(--ok)}
.kb{position:relative;height:150px;display:flex;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.kb .w{flex:1;border:0;border-right:1px solid #cfd2d6;background:linear-gradient(#fff,#f2f3f5);position:relative;display:flex;align-items:flex-end;justify-content:center;padding:0 0 6px;font-family:var(--f-mono);font-size:10px;color:#888}
.kb .w.dn{background:linear-gradient(#efe1c6,#e2cfa9)}
.kb .b{position:absolute;top:0;height:60%;border:0;border-radius:0 0 5px 5px;background:linear-gradient(#2a2d33,#111317);z-index:2;padding:0}
.kb .b.dn{background:linear-gradient(#6a5530,#3b2f18)}

/* drawing bar */
#drawbar{position:fixed;z-index:11;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--sb));border-radius:22px;padding:6px;display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 24px);box-sizing:border-box}
#drawbar .tools{display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:center}
#drawbar .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
#drawbar .ib.on{background:var(--accent-soft);color:var(--accent)}
.swc{width:26px;height:26px;border-radius:50%;border:2px solid var(--glass-2);box-shadow:0 0 0 1px var(--line);margin:0 2px;padding:0}
.swc.on{box-shadow:0 0 0 2px var(--accent)}
#drawbar input[type=range]{width:90px}
.stamps{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:640px}
.stamps button{min-width:34px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--raise);font-family:var(--f-display);font-size:16px;font-style:italic;padding:0 6px}
.stamps button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.stamps .tx{width:120px;height:32px}

/* library */
#scrim{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.08)}
#lib{position:fixed;z-index:20;top:calc(10px + var(--st));bottom:calc(10px + var(--sb));left:calc(10px + var(--sl));width:min(480px,calc(100% - 20px));border-radius:28px;display:flex;flex-direction:column;overflow:hidden;background:var(--glass-2)}
.lib-head{display:flex;align-items:center;gap:6px;padding:14px 14px 6px}
.lib-head .seg{flex:1;max-width:300px;margin:0 auto;border-radius:20px}
.lib-head .seg button{height:34px;border-radius:17px}
.lib-bar{display:flex;align-items:center;gap:4px;padding:6px 14px 8px}
.lib-bar .filter{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 10px;border-radius:10px;border:0;background:transparent;font-weight:500;max-width:52%;min-width:0}
.lib-bar .filter span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-bar .filter:hover{background:rgba(127,127,127,.12)}
.lib-bar .grow{flex:1}
.lib-bar .txt{border:0;background:transparent;height:34px;padding:0 10px;border-radius:10px;font-weight:500}
.lib-bar .txt.on{color:var(--accent)}
.lib-search{margin:0 14px 8px;display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:12px;background:rgba(127,127,127,.12)}
.lib-search input{border:0;outline:0;background:transparent;flex:1;min-width:0}
.lib-body{flex:1;overflow:auto;padding:0 16px 20px}
.lib-sec{display:flex;align-items:center;gap:8px;margin:12px 4px 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.lib-sec h4{margin:0;font-size:16px;font-weight:500;color:var(--muted)}
.lib-sec .grow{flex:1}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:20px 14px}
.bk{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.bk .ttl{font-size:12.5px;line-height:1.3;color:var(--muted);text-align:center;height:2.6em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bk button.cv{padding:0;border:0;background:none;display:block;width:100%;transition:transform .15s}
.bk button.cv:hover{transform:translateY(-3px)}
.book{position:relative;aspect-ratio:3/4.1;max-width:100%;border-radius:2px 5px 5px 2px;overflow:hidden;box-shadow:2px 3px 8px rgba(0,0,0,.25),inset -2px 0 0 rgba(0,0,0,.15);background:var(--c)}
.book::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,.18),transparent 40%,rgba(0,0,0,.12));pointer-events:none}
.book .spine{position:absolute;left:0;top:0;bottom:0;width:13%;background:repeating-linear-gradient(to bottom,#f6f6f4 0 7px,#141414 7px 8.4px);box-shadow:inset -1px 0 0 rgba(0,0,0,.4)}
.book .label{position:absolute;left:22%;right:8%;top:10%;padding:5px 6px;background:rgba(255,255,255,.9);color:#222;font-family:var(--f-display);font-size:11px;line-height:1.25;text-align:center;font-weight:700;max-height:44%;overflow:hidden;word-break:keep-all}
.book .label span{display:block;font-weight:400;font-size:9.5px;color:#555;margin-top:2px}
.book .clef{position:absolute;right:10%;bottom:8%;width:30%;opacity:.55}
.book.page img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.bk .cover-wrap{position:relative}
.bk .inf{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#6d727b;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;font-family:Georgia,serif;font-style:italic;z-index:2}
.bk .favm{position:absolute;top:6px;right:6px;color:#f3c242;z-index:2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.bk .favm svg.i{width:18px;height:18px;fill:currentColor}
.bk .sel{position:absolute;top:-6px;left:-6px;width:24px;height:24px;border-radius:50%;background:var(--raise);border:2px solid var(--muted);z-index:3;display:grid;place-items:center;pointer-events:none}
.bk.picked .sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bk.picked .sel svg.i{width:14px;height:14px;stroke-width:3}
.add-tile .book{background:transparent;border:2px dashed var(--muted);box-shadow:none;display:grid;place-items:center;color:var(--muted);opacity:.7;box-sizing:border-box}
.add-tile .book::after{display:none}
.selbar{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
.selbar .btn{flex:1}
.set-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:var(--raise);border:1px solid var(--line)}
.set-row .n{font-family:var(--f-mono);color:var(--accent);width:22px;text-align:right;flex:none}
.set-row .mini{width:34px;flex:none}
.set-row .mini .book .label,.set-row .mini .book .clef{display:none}
.set-row .t{flex:1;min-width:0}
.set-row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.set-row .t span{font-size:12px;color:var(--muted)}
.empty{grid-column:1/-1;border:1.5px dashed var(--line);border-radius:16px;padding:30px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;margin-bottom:4px}
.dropzone{position:fixed;inset:0;z-index:70;background:var(--accent-soft);border:3px dashed var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-size:24px;pointer-events:none}
#perfExit{position:fixed;z-index:15;top:calc(10px + var(--st));right:calc(12px + var(--sr));opacity:.28;height:34px;padding:0 14px;border-radius:17px;font-size:12px}
#perfExit:hover{opacity:1}
.countin{position:fixed;inset:0;z-index:40;display:grid;place-items:center;pointer-events:none}
.countin b{font-family:var(--f-display);font-size:130px;color:var(--accent);text-shadow:0 4px 30px rgba(0,0,0,.3)}
#modal{position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.4);display:grid;place-items:center;padding:16px}
.dlg{width:100%;max-width:440px;max-height:calc(100% - 32px);overflow:auto;background:var(--glass-2);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.dlg h3{margin:0;font-family:var(--f-display);font-size:20px}
.dlg-body{display:flex;flex-direction:column;gap:12px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.menu-list{display:flex;flex-direction:column;gap:2px}
.menu-list button{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px;border:0;border-radius:10px;background:transparent;text-align:left;width:100%}
.menu-list button:hover{background:rgba(127,127,127,.12)}
.menu-list button.danger{color:var(--rec)}
.menu-list .on{color:var(--accent);font-weight:700}
.menu-list em{margin-left:auto;font-style:normal;color:var(--muted);font-family:var(--f-mono);font-size:12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid var(--glass-2);box-shadow:0 0 0 1px var(--line)}
.swatches button.on{box-shadow:0 0 0 2px var(--accent)}
#install{position:fixed;z-index:25;left:50%;transform:translateX(-50%);top:calc(64px + var(--st));width:min(440px,calc(100% - 24px));border-radius:18px;padding:14px 14px 14px 16px;display:flex;gap:12px;align-items:flex-start;box-sizing:border-box}
#install b{display:block;font-family:var(--f-display);font-size:16px;margin-bottom:2px}
#install p{margin:0;font-size:13px;color:var(--muted)}
#install .share{display:inline-block;vertical-align:-3px;width:16px;height:16px}
#toast{position:fixed;left:50%;bottom:calc(140px + var(--sb));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--stage);padding:10px 16px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1}
@media (max-width:860px){.tool{min-width:54px;font-size:10px}.tab{min-width:96px}}
@media (max-width:640px){
  .tool span{display:none}.tool{min-width:42px;height:46px;padding:0 4px}.pill{height:54px}
  .pill-btn span{display:none}.pill-btn{padding:0 12px}
  #pop.at-l,#pop.at-c{left:calc(12px + var(--sl));right:calc(12px + var(--sr));width:auto;max-width:none;transform:none}
  #lib{width:auto;right:calc(10px + var(--sr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function renderPage(e,tw){tw=Math.round(clamp(tw,40,3200));const key=e.id+'|'+tw+'|'+e.rot+'|'+e.crop.join(',');const C=tw<300?rSmall:rBig;
 if(C.has(key)){const p=C.get(key);C.delete(key);C.set(key,p);return p}
 const p=(async()=>{const {w:sw,h:sh}=await srcSize(e.src);const [ct,cr,cb,cl]=e.crop;const cw0=sw*(1-cl-cr),ch0=sh*(1-ct-cb);const rotd=e.rot%180!==0;
  const k=tw/(rotd?ch0:cw0);let src,s;
  if(e.src.k==='img'){src=await getBmp(e.src.b);s=1}
  else{const pg=await (await getPdf(e.src.b)).getPage(e.src.n);const vp=pg.getViewport({scale:k});const c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:cx,viewport:vp}).promise;src=c;s=k}
  const dw=cw0*k,dh=ch0*k;const out=document.createElement('canvas');out.width=Math.max(1,Math.round(rotd?dh:dw));out.height=Math.max(1,Math.round(rotd?dw:dh));
  const x=out.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,out.width,out.height);x.imageSmoothingQuality='high';x.translate(out.width/2,out.height/2);x.rotate(e.rot*Math.PI/180);
  x.drawImage(src,sw*cl*s,sh*ct*s,cw0*s,ch0*s,-dw/2,-dh/2,dw,dh);return out})();
 C.set(key,p);p.catch(()=>C.delete(key));while(C.size>(C===rBig?10:80))C.delete(C.keys().next().value);return p}
async function makeThumb(sc){if(!sc.pages.length){sc.thumb='';return}try{const c=await renderPage(sc.pages[0],280);const t=document.createElement('canvas');t.width=c.width;t.height=c.height;t.getContext('2d').drawImage(c,0,0);sc.thumb=t.toDataURL('image/jpeg',.8)}catch(e){sc.thumb=''}}
const regenThumb=debounce(async()=>{const sc=V.score;if(!sc)return;await makeThumb(sc);saveScore(sc);if(L.open)renderLib()},700);

/* import */
const isPdf=f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name);
async function filesToPages(files){const pages=[];for(const f of files){const b=uid();await DB.put('blobs',{id:b,blob:f,type:f.type,name:f.name});
  if(isPdf(f)){try{const doc=await getPdf(b);for(let n=1;n<=doc.numPages;n++)pages.push({id:uid(),src:{k:'pdf',b,n},rot:0,crop:[0,0,0,0]})}catch(e){toast(`${f.name}: PDF를 열 수 없어요`);await DB.del('blobs',b)}}
  else if(f.type.startsWith('image/')||/\.(png|jpe?g|webp|gif|bmp)$/i.test(f.name)){try{await getBmp(b);pages.push({id:uid(),src:{k:'img',b},rot:0,crop:[0,0,0,0]})}catch(e){toast(`${f.name}: 이미지를 열 수 없어요 (HEIC는 JPG로 바꿔 주세요)`);await DB.del('blobs',b)}}
  else{toast(`${f.name}: 이미지나 PDF만 올릴 수 있어요`);await DB.del('blobs',b)}}
 return pages}
const baseName=n=>n.replace(/\.[^.]+$/,'').replace(/_+/g,' ').trim();
const parseTags=s=>[...new Set((s||'').split(',').map(t=>t.trim()).filter(Boolean))];
function folderSelect(id,val){return `<select class="tx" id="${id}"><option value="">폴더 없음</option>${S.folders.map(f=>`<option value="${f.id}" ${f.id===val?'selected':''}>${esc(f.name)}</option>`).join('')}</select>`}
function startImport(files){files=[...files].filter(Boolean);if(!files.length)return;
 const pdfs=files.filter(isPdf),imgs=files.filter(f=>!isPdf(f));const multi=imgs.length>1;const single=files.length===1||(pdfs.length===0&&imgs.length>0);
 const defFolder=L.filter.kind==='folder'?L.filter.id:'';
 dialog({title:'악보 올리기',body:`${single?`<label class="field"><span>제목</span><input class="tx" id="imTitle" value="${esc(baseName(files[0].name))}"></label><label class="field"><span>작곡가 · 가수</span><input class="tx" id="imComp" placeholder="예: 최유리"></label>`:`<p class="hint">PDF ${pdfs.length}개${imgs.length?`, 이미지 ${imgs.length}장`:''}을 올려요. 제목은 파일 이름으로 정하고 나중에 바꿀 수 있어요.</p>`}
  <div class="row"><label class="field"><span>폴더</span>${folderSelect('imFolder',defFolder)}</label><label class="field"><span>태그 (쉼표로 구분)</span><input class="tx" id="imTags" placeholder="예: 기타, 레슨"></label></div>
  ${multi?`<label class="check"><input type="checkbox" id="imMerge" checked> 이미지 ${imgs.length}장을 한 악보로 합치기 (파일 이름 순)</label>`:''}`,
 buttons:[{label:'취소'},{label:'올리기',kind:'primary',onClick:async()=>{
  const title=$('#imTitle')?.value.trim(),comp=$('#imComp')?.value.trim()||'',folderId=$('#imFolder').value||null,merge=$('#imMerge')?$('#imMerge').checked:true,tags=parseTags($('#imTags').value);
  closeDialog();toast('악보를 준비하는 중…',8000);const made=[];const groups=[];pdfs.forEach(f=>groups.push([f]));
  if(imgs.length){const sorted=imgs.slice().sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));if(merge)groups.push(sorted);else sorted.forEach(f=>groups.push([f]))}
  for(const g of groups){const pages=await filesToPages(g);if(!pages.length)continue;const sc=newScore({title:(single&&title)||baseName(g[0].name),composer:comp,folderId,tags,pages});await makeThumb(sc);await saveScore(sc);S.scores.push(sc);made.push(sc)}
  if(made.length){toast(made.length===1?`"${made[0].title}"을(를) 넣었어요`:`악보 ${made.length}개를 넣었어요`);if(made.length===1){closeLib();openScore(made[0].id)}else renderLib()}
  return false}}]})}

   if(prevStem){x.lineWidth=1.6;x.beginPath();x.moveTo(prevStem.x,prevStem.y);x.quadraticCurveTo(prevStem.x+8,prevStem.y+(prevStem.up?10:-10),prevStem.x+6,prevStem.y+(prevStem.up?20:-20));x.stroke()}mno++}
  if(page===total&&sI===n-1){x.lineWidth=5;x.beginPath();x.moveTo(Rr-2,top);x.lineTo(Rr-2,bot);x.stroke()}}
 x.textAlign='center';x.font='14px Georgia,serif';x.fillStyle='#444';x.fillText(`${page} / ${total}`,W/2,H-40);return await new Promise(res=>c.toBlob(res,'image/png'))}
async function seedSamples(){const fd={id:uid(),name:'예시 악보',createdAt:Date.now()};await DB.put('folders',fd);S.folders.push(fd);
 const defs=[{title:'작은 왈츠',sub:'피아노 독주를 위한',comp:'예시 악보 · 보면대',tempo:'Allegretto  ♩= 112',total:4,beats:3,seed:7,color:COVERS[0],tags:['피아노'],

 const ids=[];
 for(const d of defs){const pages=[];for(let p=1;p<=d.total;p++){const blob=await samplePage({...d,page:p,seed:d.seed+p*13});const b=uid();await DB.put('blobs',{id:b,blob,type:'image/png',name:`${d.title}-${p}.png`});pages.push({id:uid(),src:{k:'img',b},rot:0,crop:[0,0,0,0]})}

  await makeThumb(sc);await saveScore(sc);S.scores.push(sc);ids.push(sc.id);
  if(d.seed===7)await DB.put('ann',{id:sc.id,pages:{[pages[0].id]:[{t:'pen',c:'#d12f2f',w:.0024,p:circlePts(.62,.27,.07,.03)},{t:'txt',c:'#d12f2f',s:.03,x:.76,y:.24,v:'mf'},{t:'hl',c:'#f2c200',w:.012,p:[.15,.36,.45,.36]},{t:'txt',c:'#1f5fd1',s:.026,x:.33,y:.335,v:'2'},{t:'txt',c:'#1f5fd1',s:.026,x:.37,y:.335,v:'4'},{t:'txt',c:'#1a1a1a',s:.03,x:.9,y:.5,v:'V'}]}})}
 const sl={id:uid(),name:'예시 곡목록',items:ids,createdAt:Date.now()};await DB.put('setlists',sl);S.setlists.push(sl);return ids}
function circlePts(cx,cy,rx,ry){const p=[];for(let a=0;a<=Math.PI*2.1;a+=.2)p.push(+(cx+Math.cos(a)*rx).toFixed(4),+(cy+Math.sin(a)*ry).toFixed(4));return p}

/* pinch zoom (Safari gesture events + two-pointer fallback) */
let pz=null;
function pinchStart(){if(V.draw||!V.score)return;pz={base:V.zoom,s:1}}
function pinchMove(scale){if(!pz)return;pz.s=clamp(pz.base*scale,.5,3)/pz.base;spread.style.transform=`scale(${pz.s})`}
function pinchEnd(){if(!pz)return;const z=clamp(pz.base*pz.s,.5,3);pz=null;spread.style.transform='';if(Math.abs(z-V.zoom)>.02){V.zoom=Math.abs(z-1)<.08?1:z;layout();toast(`확대 ${Math.round(V.zoom*100)}%`,900)}}
stage.addEventListener('gesturestart',e=>{e.preventDefault();pinchStart()});
stage.addEventListener('gesturechange',e=>{e.preventDefault();pinchMove(e.scale)});
stage.addEventListener('gestureend',e=>{e.preventDefault();pinchEnd()});
const tp=new Map();let tp0=0;
stage.addEventListener('touchstart',e=>{if(e.touches.length===2&&!('ongesturestart' in window)){const[a,b]=e.touches;tp0=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);pinchStart()}},{passive:true});
stage.addEventListener('touchmove',e=>{if(e.touches.length===2&&tp0&&pz){e.preventDefault();const[a,b]=e.touches;pinchMove(Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/tp0)}},{passive:false});
stage.addEventListener('touchend',e=>{if(tp0&&e.touches.length<2){tp0=0;pinchEnd()}});

 if(L.filter.kind==='folder'&&!S.folders.some(f=>f.id===L.filter.id))L.filter={kind:'all',id:null}}

addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dragN++;dz.hidden=false}});
addEventListener('dragleave',()=>{if(--dragN<=0){dragN=0;dz.hidden=true}});addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dragN=0;dz.hidden=true;const fs=[...e.dataTransfer.files];if(!fs.length)return;if(V.score&&fs.every(f=>f.type.startsWith('audio/'))){importAudio(fs);return}startImport(fs)});
document.addEventListener('paste',e=>{if(!$('#modal').hidden)return;const fs=[...(e.clipboardData?.files||[])];if(fs.length)startImport(fs)});

 if(!S.scores.length&&(!DB.db||!LS.get('seeded',false))){try{await document.fonts.load('bold 42px "Gowun Batang"')}catch(e){}const ids=await seedSamples();LS.set('seeded',true);prefs.tabs=ids.slice();prefs.active=ids[0];savePrefs()}
